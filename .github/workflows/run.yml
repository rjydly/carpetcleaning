name: Carpet Cleaning Auto Bot

on:
  schedule:
    # S'executa cada 8 hores (3 cops al dia: 06:00, 14:00, 22:00 UTC)
    - cron: '0 6,14,22 * * *'
  workflow_dispatch: # Permet executar-lo manualment amb el botó "Run workflow"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instal·lar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar FFmpeg i Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instal·lar dependències de Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar el bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          python main.py

      - name: Guardar historial actualitzat a Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f history.json ]; then
            git add history.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update history.json [skip ci]" && git push origin main)
          fi